version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gartika_backend
    ports:
      - "8000:8000"
    environment:
      - GARTIKA_BUS_ID=BUS-101
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - DEMO_MODE=true
    volumes:
      - ./data:/app/data
      - ./gartika.db:/app/gartika.db
    restart: unless-stopped

  ai_engine:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: gartika_ai
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
      - GARTIKA_BUS_ID=BUS-101
    volumes:
      - ./data:/app/data
    restart: unless-stopped
